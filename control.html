<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Galyavision Control</title><style>body{background:#0b1024;color:#eef;font:16px system-ui;max-width:700px;margin:50px auto;padding:20px}section{background:#18233e;padding:24px;border-radius:16px;margin:16px 0}button,input{font:inherit;padding:12px;margin:5px;border-radius:8px;border:1px solid #667;background:#293a65;color:white}button{cursor:pointer}a{color:#aabfff}pre{white-space:pre-wrap}</style><h1>GALYAVISION / CONTROL</h1><section><input id="pw" type="password" placeholder="Пароль администратора"><button id="login">Войти</button><button id="logout">Выйти</button></section><section id="panel" hidden><h2>Управление публикацией</h2><pre id="status"></pre><input id="message" placeholder="Причина перерыва"><button id="stop">Включить техперерыв</button><button id="start">Опубликовать 10.0 и открыть сайт</button><button id="backup">Скачать архив и данные этапов</button><hr><input id="notice" placeholder="Системное сообщение"><button id="send">Отправить</button><button id="ro">Переключить режим просмотра</button><button id="reload">Обновить страницы</button><button id="logs">Журнал</button><pre id="log"></pre><p><a href="sandbox/" target="_blank">Sandbox</a> · <a href="index.html" target="_blank">Основной сайт</a></p></section><p id="msg"></p><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://fzwhijhauccjymwfpwkp.supabase.co','sb_publishable_ol4aEpw8knUOt8AAc0n36A_FqmdCRI_');const $=x=>document.getElementById(x);async function run(f){try{await f();$('msg').textContent='Готово'}catch(e){$('msg').textContent=e.message}}async function check(){let a=await db.rpc('g84_is_admin');$('panel').hidden=a.error||!a.data;if(!$('panel').hidden){let r=await db.from('g10_status').select('*').single();if(r.error)throw r.error;$('status').textContent=JSON.stringify(r.data,null,2)}}$('login').onclick=()=>run(async()=>{let r=await db.auth.signInWithPassword({email:'admin@galyavision.example',password:$('pw').value});if(r.error)throw r.error;$('pw').value='';await check()});$('logout').onclick=()=>run(async()=>{await db.auth.signOut();await check()});async function change(p){let r=await db.from('g10_status').update(p).eq('id',1).select();if(r.error||!r.data.length)throw r.error||Error('Нет доступа');await check()}$('stop').onclick=()=>run(()=>change({maintenance:true,message:$('message').value||'Технические работы'}));$('start').onclick=()=>run(async()=>{let r=await fetch('index.html?t='+Date.now(),{cache:'no-store'});if(!r.ok||!(await r.text()).includes('Версия 10.0'))throw Error('Новая версия ещё не опубликована');if(confirm('Открыть конкурс?'))await change({maintenance:false,version:'10.0'})});$('backup').onclick=()=>run(async()=>{let data=[];for(let i of [1,2,3]){let r=await db.rpc('g7_state',{p_stage:i});if(r.error)throw r.error;data.push(r.data)}let w=await db.from('g84_winners').select('*');if(w.error)throw w.error;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({stages:data,winners:w.data},null,2)],{type:'application/json'}));a.download='galyavision-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});$('send').onclick=()=>run(()=>change({notice:$('notice').value}));$('ro').onclick=()=>run(async()=>{let r=await db.from('g10_status').select('readonly').single();if(r.error)throw r.error;await change({readonly:!r.data.readonly})});$('reload').onclick=()=>run(async()=>{let r=await db.from('g10_status').select('revision').single();if(r.error)throw r.error;await change({revision:r.data.revision+1})});$('logs').onclick=()=>run(async()=>{let r=await db.from('g10_log').select('*').order('id',{ascending:false}).limit(30);if(r.error)throw r.error;$('log').textContent=JSON.stringify(r.data,null,2)});run(check);
</script></html>
