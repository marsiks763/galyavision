function protectedArchive(x){return x.data?.year==2026||String(x.data?.title||'').match(/(?:^|\s)1(?:\s|$)/)||String(x.id)===String(D.history.slice().sort((a,b)=>String(a.at).localeCompare(String(b.at)))[0]?.id)}
function archiveRows(x){let d=x.data||{};if(Array.isArray(d.results))return d.results.map(r=>({...r,stage:[1,2,3].includes(+r.stage)?+r.stage:0}));let rows=(d.songs||[]).filter(z=>z.ad_after===null).map(z=>{let votes=(d.votes||[]).filter(r=>r.song===z.id),song=votes.reduce((n,r)=>n+Number(r.points||0),0),clip=votes.reduce((n,r)=>n+Number(r.clip||0),0);return {stage:+z.stage,country:z.country,title:z.title,owner:Array.isArray(d.people)?d.people.find(p=>p.id===z.owner)?.name:name(z.owner),points:song+clip,...(+z.stage===3?{song_points:song,clip_points:clip}:{})}});return [1,2,3].flatMap(k=>rows.filter(r=>r.stage===k).sort((a,b)=>b.points-a.points).map((r,i)=>({...r,place:i+1})))}
function archiveDisplay(rows){return [1,2,3,0].map(k=>{let list=rows.filter(r=>r.stage===k).sort((a,b)=>(+a.place||Infinity)-(+b.place||Infinity));if(!list.length)return '';return `<div class="archive-group"><h4>${stageLabels[k]}</h4>${list.map(r=>`<div class="rank">${e(r.place??'—')}. ${e(r.country)} — ${e(r.title)} <small>${e(r.owner)}</small>${k===3?`<small>Песня: ${e(r.song_points??'—')} · Клип: ${e(r.clip_points??'—')}</small>`:''}<strong>${e(r.points??'—')}</strong></div>`).join('')}</div>`}).join('')||'<p>Результаты не внесены</p>'}
function mountArchiveEditor(root,initial){let rows=initial.map(r=>({...r})),stage=1;const fields=k=>[['place','Место',1],['country','Страна'],['title','Песня'],['owner','Участник'],...(k===3?[['song_points','Баллы за песню',0,20],['clip_points','Баллы за клип',0,20]]:[['points','Баллы',0]])];function draw(){root.innerHTML=`<div class="archive-tabs">${[1,2,3,...(rows.some(r=>!r.stage)?[0]:[])].map(k=>`<button type="button" data-k="${k}" class="${k===stage?'active':''}">${stageLabels[k]} (${rows.filter(r=>r.stage===k).length})</button>`).join('')}</div><div>${rows.map((r,i)=>r.stage!==stage?'':`<div class="archive-entry" data-i="${i}"><div class="archive-fields">${fields(stage).map(([key,label,min,max])=>`<label>${label}<input data-key="${key}" ${min!==undefined?`type="number" min="${min}" step="1" ${max!==undefined?`max="${max}"`:''}`:''} value="${e(r[key]??'')}"></label>`).join('')}</div>${stage===3?`<p>Итого: <strong data-total>${r.song_points!=null&&r.clip_points!=null?Number(r.song_points)+Number(r.clip_points):'—'}</strong></p>`:''}<button type="button" class="archive-danger" data-remove>Удалить песню</button></div>`).join('')}</div><button type="button" data-add>Добавить песню</button>`;root.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{stage=+b.dataset.k;draw()});root.querySelectorAll('[data-i]').forEach(el=>{let r=rows[+el.dataset.i];el.querySelectorAll('[data-key]').forEach(input=>input.oninput=()=>{r[input.dataset.key]=input.value===''?null:input.value;if(stage===3)el.querySelector('[data-total]').textContent=r.song_points!=null&&r.clip_points!=null?Number(r.song_points)+Number(r.clip_points):'—'});el.querySelector('[data-remove]').onclick=()=>{rows.splice(+el.dataset.i,1);draw()}});root.querySelector('[data-add]').onclick=()=>{rows.push({stage});draw()}}draw();return {collect(){return rows.filter(r=>Object.entries(r).some(([k,v])=>k!=='stage'&&v!=null&&v!=='')).map(r=>{let out={...r};for(let [key,label,min,max] of fields(r.stage)){if(min===undefined||out[key]==null||out[key]==='')continue;let n=Number(out[key]);if(!Number.isInteger(n)||n<min||(max!==undefined&&n>max))throw Error(stageLabels[r.stage]+': неверное значение «'+label+'»');out[key]=n}if(r.stage===3){out.points=out.song_points!=null&&out.clip_points!=null?Number(out.song_points)+Number(out.clip_points):null}return out})}}}
async function seasonAction(a,p){if(busy||!await gate10())return;busy=true;try{await rpc('g8_season',{a,p});signature='';await refresh();toast(a==='reset_current'?'Текущий сезон удалён, новый создан':a==='delete'?'Сезон удалён':'Сезон сохранён')}catch(x){err(x)}finally{busy=false}}function download(data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='galyavision.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function tick(){if($('adcard')){let [a,b]=sponsors[Math.floor(Date.now()/5000)%sponsors.length];if($('adcard').dataset.sponsor!==a){$('adcard').dataset.sponsor=a;$('adcard').innerHTML=`<small>РЕКЛАМА</small><h2>${e(a)}</h2>${e(b)}`}}if($('countdown')){let el=$('countdown');if(!D.stage.starts_at){el.textContent='Ожидаем начала эфира'}else{let n=Math.max(0,Math.ceil((new Date(D.stage.starts_at)-Date.now())/1000));let t=[Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':');let html=n?'До начала: <strong>'+t+'</strong>':'<strong>Галявидение начинается!</strong>';if(el.innerHTML!==html)el.innerHTML=html;el.classList.toggle('urgent',n>0&&n<=10)}}}function err(x){toast(x.message||String(x),true)}function toast(message,error=false){let box=document.getElementById('toastbox');if(!box){box=document.createElement('div');box.id='toastbox';box.setAttribute('role','status');document.body.append(box)}let el=document.createElement('div');el.className='toast81'+(error?' error':'');el.textContent=message;box.append(el);setTimeout(()=>el.remove(),4000)}
function modal(title,fields){return new Promise(resolve=>{let d=document.createElement('dialog');d.innerHTML='<form method="dialog"><h3></h3>'+fields+'<menu><button value="cancel" formnovalidate>Отмена</button><button value="ok">Подтвердить</button></menu></form>';d.querySelector('h3').textContent=title;document.body.append(d);d.addEventListener('close',()=>{let result=d.returnValue==='ok'?Object.fromEntries(new FormData(d.querySelector('form'))):null;d.remove();resolve(result)},{once:true});d.showModal()})}async function ask(t){return (await modal(t,''))!==null}function editSeason(d){return new Promise(resolve=>{let dlg=document.createElement('dialog');dlg.style.width='min(850px,94vw)';dlg.innerHTML=`<form><h3>Редактировать сезон</h3><label>Название<input name="title" required value="${e(d.title||'')}"></label><label>Год<input name="year" type="number" min="1900" max="2200" required value="${e(d.year||2026)}"></label><div id="archive-edit-root"></div><menu><button type="button" data-cancel>Отмена</button><button>Сохранить</button></menu></form>`;document.body.append(dlg);let editor=mountArchiveEditor(dlg.querySelector('#archive-edit-root'),archiveRows({data:d})),result=null;dlg.querySelector('[data-cancel]').onclick=()=>dlg.close();dlg.querySelector('form').onsubmit=ev=>{ev.preventDefault();try{result={...Object.fromEntries(new FormData(ev.target)),results:editor.collect()};dlg.close()}catch(x){err(x)}};dlg.addEventListener('close',()=>{dlg.remove();resolve(result)},{once:true});dlg.showModal()})}
function setupPreview(){let f=document.querySelector('#songform input[type=file]');if(!f)return;let wrap=document.createElement('div');wrap.className='drop81';f.before(wrap);wrap.append(f);let hint=document.createElement('small');hint.textContent='Перетащи изображение сюда или выбери файл';wrap.prepend(hint);let img=document.createElement('img');img.hidden=true;wrap.append(img);let objectUrl;f.addEventListener('change',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);let file=f.files[0];img.hidden=!file;if(file){objectUrl=URL.createObjectURL(file);img.src=objectUrl}});wrap.ondragover=ev=>{ev.preventDefault();wrap.classList.add('over')};wrap.ondragleave=()=>wrap.classList.remove('over');wrap.ondrop=ev=>{ev.preventDefault();wrap.classList.remove('over');let file=ev.dataTransfer.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){toast('Выбери PNG, JPEG или WebP до 5 МБ',true);return}let dt=new DataTransfer();dt.items.add(file);f.files=dt.files;f.dispatchEvent(new Event('change'))}}

async function loadWinners(){const root=$('winnerlist');if(!root)return;const r=await db.from('g84_winners').select('*').order('year',{ascending:false}).order('created_at',{ascending:false});if(!root.isConnected)return;if(r.error){root.textContent='Не удалось загрузить победителей: '+r.error.message;return}root.innerHTML=r.data.map(w=>`<article class="winnercard">${url(w.photo)?`<img src="${url(w.photo)}" alt="${e(w.artist)}" loading="lazy">`:'<div class="preview">1</div>'}<div><small>${e(w.season)} · ${e(w.year)}</small><h2>${e(w.artist)}</h2><h3>${e(w.song)}</h3><p>${e(w.country)} · ${e(w.owner)}</p><div class="winnerpoints">${e(w.points)} баллов</div><p>${e(w.description)}</p>${url(w.video)?`<a href="${url(w.video)}" target="_blank" rel="noopener noreferrer">Смотреть клип</a>`:''}${tab==='admin'&&D.admin?`<p><button data-we="${w.id}">Редактировать</button> <button class="archive-danger" data-wd="${w.id}">Удалить</button></p>`:''}</div></article>`).join('')||'<p>Победители пока не добавлены.</p>';root.querySelectorAll('[data-we]').forEach(b=>b.onclick=()=>winnerEdit(r.data.find(w=>w.id===b.dataset.we)));root.querySelectorAll('[data-wd]').forEach(b=>b.onclick=async()=>{if(!await ask('Удалить только карточку победителя? Сезон останется.'))return;const res=await db.from('g84_winners').delete().eq('id',b.dataset.wd).select('id');if(res.error||!res.data?.length)return err(res.error||Error('Карточка не удалена'));toast('Карточка удалена');loadWinners()})}
async function winnerEdit(w={}){if(!D.admin||gateState?.maintenance||gateState?.readonly)return;const fields=[['season','Название сезона'],['year','Год','number'],['country','Страна'],['artist','Исполнитель'],['song','Песня'],['owner','Владелец страны'],['points','Баллы','number'],['photo','Ссылка на фото','url'],['video','Ссылка на клип','url'],['description','Описание']];const p=await modal(w.id?'Редактировать победителя':'Добавить победителя',fields.map(([k,l,t='text'],i)=>`<label>${l}<input name="${k}" type="${t}" ${i<7?'required':''} ${k==='year'?'min="1900" max="2200"':k==='points'?'min="0" max="40"':''} value="${e(w[k]??(k==='year'?new Date().getFullYear():''))}"></label>`).join(''));if(!p)return;p.year=Number(p.year);p.points=Number(p.points);const q=db.from('g84_winners');const r=await (w.id?q.update(p).eq('id',w.id):q.insert(p)).select('id');if(r.error||!r.data?.length)return err(r.error||Error('Карточка не сохранена'));toast('Победитель сохранён');loadWinners()}

let up=document.createElement('button');up.id='up81';up.textContent='↑';up.title='Наверх';up.hidden=true;document.body.append(up);up.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',()=>up.hidden=window.scrollY<400,{passive:true});
let gateState=null, gateBusy=false, releaseReload=false;
async function gate10(){if(gateBusy)return false;gateBusy=true;try{const r=await db.from('g10_status').select('*').eq('id',1).single();if(r.error)throw r.error;const old=gateState;gateState=r.data;const blocked=gateState.maintenance||gateState.version!=='10.0';if(blocked){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});document.querySelectorAll('dialog').forEach(d=>d.close());$('auth').hidden=true;$('nav').hidden=true;$('view').innerHTML='<div class="hero90"><small>TECHNICAL SERVICE</small><h1>Технический перерыв</h1><p>'+e(gateState.message||'Подготавливаем обновление конкурса')+'</p></div>';tab='home';signature='';return false;}if(old&&(old.maintenance||old.version!==gateState.version||old.revision!==gateState.revision)&&!releaseReload){releaseReload=true;location.replace(location.pathname+'?release='+encodeURIComponent(gateState.version)+'&t='+Date.now());return false;}$('auth').hidden=false;$('nav').hidden=false;document.getElementById('notice10').textContent=gateState.notice||'';return true;}catch(x){$('auth').hidden=true;$('nav').hidden=true;$('view').textContent='Сервис временно недоступен. Повторяем подключение.';signature='';return false;}finally{gateBusy=false;}}
setInterval(async()=>{if(await gate10()&&!signature&&!busy)refresh().catch(err)},3000);
session=(await db.auth.getSession()).data.session;auth();if(await gate10())await refresh().catch(err);setInterval(tick,1000);setInterval(()=>{if(tab==='winners')loadWinners()},10000);setInterval(()=>{if(!busy&&!document.activeElement?.matches('input,select')&&tab!=='admin'&&tab!=='history')refresh().catch(err);else if(!busy&&tab==='admin'&&D?.stage.phase!=='preparation')refresh().catch(err)},4000);
</script></html>
