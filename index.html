function download(data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='galyavision.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function tick(){if($('adcard')){let [a,b]=sponsors[Math.floor(Date.now()/5000)%sponsors.length];if($('adcard').dataset.sponsor!==a){$('adcard').dataset.sponsor=a;$('adcard').innerHTML=`<small>РЕКЛАМА</small><h2>${e(a)}</h2>${e(b)}`}}if($('countdown')){let el=$('countdown');if(!D.stage.starts_at){el.textContent='Согласовываем бюджет с АТБ…'}else{let n=Math.max(0,Math.ceil((new Date(D.stage.starts_at)-Date.now())/1000));let t=[Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':');let html=n?'До начала: <strong>'+t+'</strong>':'<strong>Галявидение начинается!</strong>';if(el.innerHTML!==html)el.innerHTML=html;el.classList.toggle('urgent',n>0&&n<=10)}}}function err(x){$('msg').textContent=x.message||String(x)}session=(await db.auth.getSession()).data.session;auth();await refresh().catch(err);setInterval(tick,1000);setInterval(()=>{if(!busy&&!document.activeElement?.matches('input,select')&&tab!=='admin')refresh().catch(err);else if(!busy&&tab==='admin'&&D?.stage.phase!=='preparation')refresh().catch(err)},4000);
</script></html>
