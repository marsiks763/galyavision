</p><button id="adminresults">Открыть результаты</button>`;if(s.phase==='preparation'){let x=edit||{};h+=`<div data-panel="settings"><form id="quota"><label>${s.id===3?'Всего песен':'Песен от каждого'} <input name="quota" type="number" min="1" max="100" value="${s.quota}"></label><button>Сохранить</button></form></div><div data-panel="songs ads"><form id="songform">${adminMenu==='ads'?'<input type="hidden" name="owner" value=""><input type="hidden" name="country" value="Реклама">':`<select name="owner">${D.people.map(p=>`<option value="${p.id}" ${p.id===x.owner?'selected':''}>${e(p.name)}</option>`).join('')}</select><input name="country" placeholder="Страна" value="${e(x.country)}" required>`}<input name="title" placeholder="Песня" value="${e(x.title)}" required><input name="video" placeholder="Ссылка на видео" value="${e(x.video)}"><input name="file" type="file" accept="image/png,image/jpeg,image/webp"><input name="ad_after" type="hidden" value="${adminMenu==='ads'?1:''}"><button>Сохранить песню</button></form><button id="new">Новая песня</button></div><div data-panel="settings"><form id="timer"><input name="time" type="datetime-local" required><button>Таймер</button></form>`+btn('test','Тестовые песни')+btn('delete_test','Удалить тестовые')+'</div><div data-panel="overview">'+btn('start','Начать конкурс') +'</div><div data-panel="order"><h3>Порядок выступлений</h3><p>Перетащите песни или используйте стрелки, затем сохраните порядок.</p><div id="orderlist">'+songs.map((x,i)=>`<div class="rank orderrow" draggable="true" data-id="${x.id}"><span class="ordnum">${i+1}.</span> <span>☰ ${e(x.country)} — ${e(x.title)}</span><button data-move="-1">↑</button><button data-move="1">↓</button><button data-edit="${x.id}">✎</button>${btn('delete','Удалить',{id:x.id})}</div>`).join('')+'</div><button id="saveorder">Сохранить порядок</button></div><div data-panel="ads"><h3>Рекламные песни</h3>'+D.songs.filter(x=>x.ad_after!==null).map(x=>`<div class="rank">${e(x.country)} — ${e(x.title)}<button data-edit="${x.id}">✎</button>${btn('delete','Удалить',{id:x.id})}</div>`).join('')+'</div><div data-panel="songs"><input id="songsearch" placeholder="Поиск песни, страны или владельца">'+songs.map(x=>`<div class="rank searchable" data-search="${e([x.country,x.title,name(x.owner)].join(' ').toLowerCase())}">${e(x.country)} — ${e(x.title)} <button data-edit="${x.id}">✎</button>${btn('delete','Удалить',{id:x.id})}</div>`).join('')+'</div>'}h+='<div data-panel="ads">'+(s.phase==='voting'?(s.ad?btn('resume','Закончить рекламу'):btn('ad_start','Запустить рекламу')):'<p>Рекламу можно запустить во время эфира.</p>')+'</div><div data-panel="overview">';if(s.phase==='voting')h+=`<p>Выступление ${s.pos}/${songs.length} · оценили: ${D.ready.length}/2 · подтвердили ${D.confirmed.length}/3</p>`+(s.ad?btn('resume','Закончить рекламу'):btn('pause',s.paused?'Продолжить':'Пауза')+btn('advance','Следующая песня'))+btn('reveal','Раскрыть оценки');if(s.phase==='reveal')h+=btn('next','Следующая оценка')+btn('finish','Финал этапа');if(s.phase==='finished')h+='<p>Архивирование доступно в разделе «Сезоны».</p>';h+='</div><div data-panel="settings">'+btn('reset','Сбросить текущий этап')+'</div><div data-panel="votes"><h3>Контроль голосования</h3>'+D.votes.map(r=>`<p>${e(name(r.voter))} → ${e(songs.find(x=>x.id===r.song)?.country)}: ${r.points}${r.clip===null?'':' + '+r.clip} · ${D.confirmed.includes(r.voter)?'подтверждено':'черновик'}</p>`).join('')+'</div></div></div>'}
if(tab==='results'){h+=`<select id="browse">${D.stages.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${e(x.label)}</option>`).join('')}</select>`;if(['reveal','finished'].includes(s.phase)){let totals=songs.map(x=>({...x,total:D.reveals.filter(r=>r.song===x.id).reduce((a,r)=>a+r.points+(r.clip||0),0)})).sort((a,b)=>b.total-a.total);let last=D.reveals.at(-1);if(last)h+=`<h3>${e(name(last.voter))} → ${e(songs.find(x=>x.id===last.song)?.country)} +${last.points+(last.clip||0)}</h3>`;h+=totals.map((x,i)=>`<div class="rank">${i+1}. ${e(x.country)} — ${e(x.title)} <strong>${x.total}</strong></div>`).join('');if(s.phase==='finished')h+=`<h3>🏆 Легенда: ${e(totals[0]?.country)} · Почётное дно: ${e(totals.at(-1)?.country)}</h3>`+D.reveals.map(r=>`<p>${e(name(r.voter))} → ${e(songs.find(x=>x.id===r.song)?.country)}: ${r.points}${r.clip===null?'':' + '+r.clip}</p>`).join('')+'<button id="export">Экспорт JSON</button>'}else h+='<p>Результаты скрыты</p>'}
if(tab==='history'){h=`<h2>Сезоны конкурса</h2><article><small>Текущий сезон</small><h3>${e(D.season.title)} · ${D.season.year}</h3></article>`;if(D.admin)h+=`<article><h3>Управление сезонами</h3><form id="seasonmeta" class="seasonform"><input name="title" required value="${e(D.season.title)}"><input name="year" type="number" min="1900" max="2200" required value="${D.season.year}"><button type="submit" value="rename">Изменить название текущего</button><button type="submit" value="new">Архивировать текущий и начать новый</button></form><small>Новый сезон доступен после завершения всех этапов. Название и год выше будут использованы для нового сезона.</small></article><article><h3>Добавить прошлый сезон</h3><form id="seasonimport" class="seasonform"><input name="title" placeholder="Название сезона" required><input name="year" type="number" min="1900" max="2200" value="2026" required><label>Дата (необязательно)<input name="date" type="date"></label><input name="people" placeholder="Участники (через запятую)"><small>Место / страна / песня / участник / баллы</small><div id="seasonrows"></div><button type="button" id="addseasonrow">Добавить песню</button><button>Сохранить прошлый сезон</button></form></article>`;h+=D.history.map(x=>{let d=x.data||{}, rows=archiveRows(x);return `<article class="seasoncard" data-archive="${e([d.title,d.year,...rows.flatMap(r=>[r.country,r.title,r.owner])].join(" ").toLowerCase())}"><details><summary>${e(d.title||'Архив конкурса')} ${e(d.year||'')} · ${e(d.date||String(x.at).slice(0,10))}</summary><p>${e(typeof d.people==='string'?d.people:'')}</p>${rows.map((r,i)=>`<div class="rank">${e(r.place??(d.manual?'—':i+1))}. ${e(r.country)} — ${e(r.title)} <small>${e(r.owner)}</small><strong>${e(r.points??'—')}</strong></div>`).join('')||'<p>Результаты не внесены</p>'}<button data-history="${x.id}">Скачать данные</button>${D.admin?` <button data-season-edit="${x.id}">Редактировать</button> <button class="archive-danger" data-season-delete="${x.id}">Удалить сезон</button>`:""}</details></article>`}).join('')||'<p>Архив пока пуст</p>'}
v.innerHTML=h;if($('seasonmeta'))$('seasonmeta').onsubmit=async ev=>{ev.preventDefault();let a=ev.submitter.value,p=Object.fromEntries(new FormData(ev.target));if(a==='new'&&!await ask('Архивировать завершённый сезон и очистить текущие песни и оценки?'))return;await seasonAction(a,p)};if($('seasonimport')){const add=()=>{let row=document.createElement('div');row.className='seasonrow';row.innerHTML='<input name="place" type="number" min="1" placeholder="Место"><input name="country" placeholder="Страна"><input name="title" placeholder="Песня"><input name="owner" placeholder="Участник"><input name="points" type="number" min="0" placeholder="Баллы">';$('seasonrows').append(row)};$('addseasonrow').onclick=add;add();$('seasonimport').onsubmit=async ev=>{ev.preventDefault();let f=ev.target,p={title:f.elements.namedItem('title')[0]?.value||f.querySelector('input[name=title]').value,year:f.elements.year.value,date:f.elements.date.value,people:f.elements.people.value,results:[...$('seasonrows').children].map(r=>Object.fromEntries([...r.querySelectorAll('input')].map(i=>[i.name,i.value||null]))).filter(r=>Object.values(r).some(Boolean))};await seasonAction('import',p)}};v.querySelectorAll("[data-stagechoice]").forEach(b=>b.onclick=()=>{edit=null;act("select",{stage:+b.dataset.stagechoice})});if($("adminresults"))$("adminresults").onclick=()=>{tab="results";browse=null;signature="";refresh().catch(err)};v.querySelectorAll('[data-panel]').forEach(p=>p.hidden=!p.dataset.panel.split(' ').includes(adminMenu));v.querySelectorAll('[data-adminmenu]').forEach(b=>b.onclick=()=>{adminMenu=b.dataset.adminmenu;edit=null;render()});if($('songsearch'))$('songsearch').oninput=()=>v.querySelectorAll('.searchable').forEach(r=>r.hidden=!r.dataset.search.includes($('songsearch').value.toLowerCase()));$('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));v.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{let a=b.dataset.action;if(['reset','delete','start','confirm'].includes(a)&&!await ask('Подтвердить действие?'))return;act(a,JSON.parse(b.dataset.p))});v.querySelectorAll('[data-vote]').forEach(f=>f.onsubmit=ev=>{ev.preventDefault();let p=Object.fromEntries(new FormData(f));act('vote',{song:f.dataset.vote,...p})});if($('stagepick'))$('stagepick').onchange=()=>{edit=null;act('select',{stage:+$('stagepick').value})};if($('browse'))$('browse').onchange=()=>{browse=+$('browse').value;signature='';refresh().catch(err)};if($('quota'))$('quota').onsubmit=ev=>{ev.preventDefault();act('quota',{quota:+ev.target.quota.value})};if($('timer'))$('timer').onsubmit=ev=>{ev.preventDefault();act('timer',{time:new Date(ev.target.time.value).toISOString()})};if($('songform'))$('songform').onsubmit=async ev=>{ev.preventDefault();let p=Object.fromEntries(new FormData(ev.target));let f=p.file;delete p.file;p.preview=edit?.preview||null;if(f.size){let path=crypto.randomUUID(),r=await db.storage.from('previews').upload(path,f);if(r.error)return err(r.error);p.preview=db.storage.from('previews').getPublicUrl(path).data.publicUrl}p.ad_after=p.ad_after?+p.ad_after:null;if(p.ad_after!==null)p.owner=null;p.id=edit?.id||null;edit=null;act('save',p)};if($('new'))$('new').onclick=()=>{edit=null;render()};v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{edit=D.songs.find(x=>x.id===b.dataset.edit);adminMenu=edit.ad_after===null?'songs':'ads';render()});if($('orderlist')){let list=$('orderlist'),drag=null;const renumber=()=>[...list.children].forEach((r,i)=>r.querySelector('.ordnum').textContent=(i+1)+'.');list.querySelectorAll('.orderrow').forEach(r=>{r.ondragstart=ev=>{drag=r;ev.dataTransfer.setData('text/plain',r.dataset.id)};r.ondragend=()=>drag=null;r.ondragover=ev=>ev.preventDefault();r.ondrop=ev=>{ev.preventDefault();if(drag&&drag!==r){let after=ev.clientY>r.getBoundingClientRect().top+r.offsetHeight/2;list.insertBefore(drag,after?r.nextSibling:r);renumber()}};r.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{if(+b.dataset.move<0&&r.previousElementSibling)list.insertBefore(r,r.previousElementSibling);else if(+b.dataset.move>0&&r.nextElementSibling)list.insertBefore(r.nextElementSibling,r);renumber()})});$('saveorder').onclick=()=>act('reorder',{stage:s.id,ids:[...list.children].map(r=>r.dataset.id)})} if($('full'))$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():v.requestFullscreen();if($('export'))$('export').onclick=()=>download({songs, votes:D.reveals});v.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>download(D.history.find(x=>x.id==b.dataset.history).data));if($('archivesearch'))$('archivesearch').oninput=()=>v.querySelectorAll('[data-archive]').forEach(r=>r.hidden=!r.dataset.archive.includes($('archivesearch').value.toLowerCase()));v.querySelectorAll('[data-season-delete]').forEach(b=>b.onclick=async()=>{if(await ask('Удалить архивный сезон навсегда?'))seasonAction('delete',{id:b.dataset.seasonDelete})});v.querySelectorAll('[data-season-edit]').forEach(b=>b.onclick=async()=>{let d=D.history.find(x=>String(x.id)===b.dataset.seasonEdit)?.data||{};let values=await editSeason(d);if(!values)return;let {title,year}=values;seasonAction('edit',{id:b.dataset.seasonEdit,title,year})});setupPreview();tick()}
function archiveRows(x){let d=x.data||{};return (d.results|| (d.songs||[]).filter(z=>z.stage===3&&z.ad_after===null).map(z=>({country:z.country,title:z.title,owner:Array.isArray(d.people)?d.people.find(p=>p.id===z.owner)?.name:name(z.owner),points:(d.votes||[]).filter(r=>r.song===z.id).reduce((n,r)=>n+r.points+(r.clip||0),0)})).sort((a,b)=>b.points-a.points)).slice().sort((a,b)=>d.manual?((+a.place||Infinity)-(+b.place||Infinity)):b.points-a.points)}
async function seasonAction(a,p){if(busy)return;busy=true;try{await rpc('g8_season',{a,p});signature='';await refresh();toast(a==='delete'?'Сезон удалён':'Сезон сохранён')}catch(x){err(x)}finally{busy=false}}function download(data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='galyavision.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function tick(){if($('adcard')){let [a,b]=sponsors[Math.floor(Date.now()/5000)%sponsors.length];if($('adcard').dataset.sponsor!==a){$('adcard').dataset.sponsor=a;$('adcard').innerHTML=`<small>РЕКЛАМА</small><h2>${e(a)}</h2>${e(b)}`}}if($('countdown')){let el=$('countdown');if(!D.stage.starts_at){el.textContent='Согласовываем бюджет с АТБ…'}else{let n=Math.max(0,Math.ceil((new Date(D.stage.starts_at)-Date.now())/1000));let t=[Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':');let html=n?'До начала: <strong>'+t+'</strong>':'<strong>Галявидение начинается!</strong>';if(el.innerHTML!==html)el.innerHTML=html;el.classList.toggle('urgent',n>0&&n<=10)}}}function err(x){toast(x.message||String(x),true)}function toast(message,error=false){let box=document.getElementById('toastbox');if(!box){box=document.createElement('div');box.id='toastbox';box.setAttribute('role','status');document.body.append(box)}let el=document.createElement('div');el.className='toast81'+(error?' error':'');el.textContent=message;box.append(el);setTimeout(()=>el.remove(),4000)}
function modal(title,fields){return new Promise(resolve=>{let d=document.createElement('dialog');d.innerHTML='<form method="dialog"><h3></h3>'+fields+'<menu><button value="cancel" formnovalidate>Отмена</button><button value="ok">Подтвердить</button></menu></form>';d.querySelector('h3').textContent=title;document.body.append(d);d.addEventListener('close',()=>{let result=d.returnValue==='ok'?Object.fromEntries(new FormData(d.querySelector('form'))):null;d.remove();resolve(result)},{once:true});d.showModal()})}async function ask(t){return (await modal(t,''))!==null}function editSeason(d){return modal('Редактировать сезон',`<label>Название<input name="title" required value="${e(d.title||'')}"></label><label>Год<input name="year" type="number" min="1900" max="2200" required value="${e(d.year||2026)}"></label>`)}
function setupPreview(){let f=document.querySelector('#songform input[type=file]');if(!f)return;let wrap=document.createElement('div');wrap.className='drop81';f.before(wrap);wrap.append(f);let hint=document.createElement('small');hint.textContent='Перетащи изображение сюда или выбери файл';wrap.prepend(hint);let img=document.createElement('img');img.hidden=true;wrap.append(img);let objectUrl;f.addEventListener('change',()=>{if(objectUrl)URL.revokeObjectURL(objectUrl);let file=f.files[0];img.hidden=!file;if(file){objectUrl=URL.createObjectURL(file);img.src=objectUrl}});wrap.ondragover=ev=>{ev.preventDefault();wrap.classList.add('over')};wrap.ondragleave=()=>wrap.classList.remove('over');wrap.ondrop=ev=>{ev.preventDefault();wrap.classList.remove('over');let file=ev.dataTransfer.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){toast('Выбери PNG, JPEG или WebP до 5 МБ',true);return}let dt=new DataTransfer();dt.items.add(file);f.files=dt.files;f.dispatchEvent(new Event('change'))}}
let up=document.createElement('button');up.id='up81';up.textContent='↑';up.title='Наверх';up.hidden=true;document.body.append(up);up.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});window.addEventListener('scroll',()=>up.hidden=window.scrollY<400,{passive:true});
session=(await db.auth.getSession()).data.session;auth();await refresh().catch(err);setInterval(tick,1000);setInterval(()=>{if(!busy&&!document.activeElement?.matches('input,select')&&tab!=='admin'&&tab!=='history')refresh().catch(err);else if(!busy&&tab==='admin'&&D?.stage.phase!=='preparation')refresh().catch(err)},4000);
</script></html>
