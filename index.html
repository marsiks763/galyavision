<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Галявидение</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(at top left,#43258a,transparent 55%),#100b20;color:white;font:16px system-ui;min-height:100vh}main{max-width:1150px;margin:auto;padding:24px}header{padding:45px 15px;text-align:center;background:linear-gradient(120deg,#34208b,#a22280);border-radius:24px}h1{font-size:clamp(32px,7vw,80px);margin:10px;color:#ffe06b}button,input,select{font:inherit;border-radius:10px;padding:11px;border:1px solid #64517e}button{background:#ffe06b;color:#20132e;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}input,select{background:#241a39;color:white;max-width:100%}section,article{background:#20172f;border:1px solid #514065;border-radius:18px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.grid article{margin:0;overflow:hidden}.preview{width:100%;aspect-ratio:16/9;object-fit:cover;background:linear-gradient(120deg,#4731a1,#922879);display:grid;place-items:center;font-size:44px}.gold{color:#ffe06b}a{color:#ffe06b}form{display:flex;flex-wrap:wrap;gap:10px}small{color:#d4bce8}.rank{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #514065;animation:appear .4s}.rank strong{margin-left:auto}@keyframes appear{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}.confetti{position:fixed;top:-20px;pointer-events:none;animation:fall 4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}#msg{white-space:pre-wrap;color:#ffe06b}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}[hidden]{display:none!important}header{background:radial-gradient(ellipse at 50% 110%,#d52da7,transparent 55%),linear-gradient(120deg,#15134c,#42217d);border:1px solid #7958ac;box-shadow:0 12px 60px #0005}#tabs button{background:#302345;color:white}#tabs button.active{background:#ffe06b;color:#20132e}.stagepic{max-height:460px;object-fit:contain;background:#100b20}.stagehead{text-align:center}.points{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.point{padding:12px;border-radius:10px;background:#33264b;text-align:center}.used{background:#8a642c;color:white}.point small{display:block}.grid article{box-shadow:0 8px 20px #0003}.grid article h2{margin-bottom:4px}#admin form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}#admin input,#admin select{width:100%}button:hover:not(:disabled){filter:brightness(1.12)}.podium{display:flex;gap:10px;flex-wrap:wrap}.podium article{flex:1;min-width:140px;text-align:center}</style><main><header><small>★ GRAND FINAL • UNITED BY КРИНЖ ★</small><h1>ГАЛЯВИДЕНИЕ</h1>Здесь рождаются легенды. И коллективный стыд.</header><section id="auth"><form id="login"><select id="email"><option>admin@galyavision.example</option><option>player1@galyavision.example</option><option>player2@galyavision.example</option></select><input id="pw" type="password" placeholder="Пароль" required><button>Войти</button></form><div id="who"></div></section><p id="msg" role="status"></p><nav id="tabs"></nav><section id="stage"></section><section id="status"></section><section id="admin" hidden></section><h2 id="songheading">🎤 Конкурсные выступления</h2><div id="songs" class="grid"></div><section id="ballot" hidden></section><section id="results" hidden><h2>Результаты пока скрыты</h2></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://fzwhijhauccjymwfpwkp.supabase.co','sb_publishable_ol4aEpw8knUOt8AAc0n36A_FqmdCRI_');
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), safe=x=>{try{let u=new URL(x);return ['https:','http:'].includes(u.protocol)?esc(u.href):''}catch{return ''}};let tab="stage", profile=null,people=[],songs=[],contest={},statuses=[],draft={},editing=null,lastReveal=-1,celebrated=false,busy=false;const unwrap=r=>{if(r.error)throw Error(r.error.message);return r.data};const rpc=async(n,p)=>unwrap(await db.rpc(n,p));function error(e){$('msg').textContent=e.message||String(e)}async function act(fn){if(busy)return;busy=true;try{$('msg').textContent='';await fn();await refresh()}catch(e){error(e)}finally{busy=false}}$('login').onsubmit=e=>{e.preventDefault();act(async()=>{unwrap(await db.auth.signInWithPassword({email:$('email').value,password:$('pw').value}));$('pw').value='';profile=await rpc('my_profile');if(Array.isArray(profile))profile=profile[0];draft={}})};
async function refresh(){let [p,s,c]=await Promise.all([db.from('participants').select('id,name'),db.from('songs').select('*'),db.from('contest').select('*').eq('id',1).single()]);people=unwrap(p);songs=unwrap(s).sort((a,b)=>(a.performance_order??999)-(b.performance_order??999)||a.slot-b.slot||a.participant_id.localeCompare(b.participant_id));contest=unwrap(c);statuses=profile?await rpc('live_voting_status'):[];draft=profile?Object.fromEntries((await rpc('my_draft_votes')).map(v=>[v.song_id,v.points])):{};render();if(['reveal','finished'].includes(contest.phase))await results();tabs()}
function tabs(){let choices=[['stage','🎤 Сцена'],['songs','🌍 Страны'],...(profile?[['ballot','🗳 Голосование']]:[]),['results','🏆 Результаты'],...(profile?.is_admin?[['admin','👑 Админка']]:[])];if(!choices.some(x=>x[0]===tab))tab='stage';$('tabs').innerHTML=choices.map(([id,label])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;tabs()});for(let id of ['stage','songs','ballot','results','admin'])$(id).hidden=id!==tab;$('songheading').hidden=tab!=='songs';$('status').hidden=tab!=='stage';}
function stage(){let s=songs.find(x=>x.id===contest.current_song_id);$('stage').innerHTML=s?`<div class="stagehead"><small>LIVE • ВЫСТУПЛЕНИЕ ${s.performance_order}/15</small><h1>${esc(s.country)}</h1><h2>${esc(s.title)}</h2><p>${esc(name(s.participant_id))} · ${esc(s.nomination)}</p></div>${safe(s.preview_url)?`<img class="preview stagepic" src="${safe(s.preview_url)}">`:'<div class="preview stagepic">🎤</div>'}<nav>${safe(s.video_url)?`<a target="_blank" rel="noopener noreferrer" href="${safe(s.video_url)}">▶ Открыть выступление</a>`:''}${profile&&contest.phase==='voting'?'<button id="govote">Мои оценки</button>':''}</nav>`:'<h2>🎤 Сцена готовится</h2><p>Ожидаем начала конкурса.</p>';if($('govote'))$('govote').onclick=()=>{tab='ballot';tabs()}}
const name=id=>people.find(p=>p.id===id)?.name||'Участник';function render(){ $('login').hidden=!!profile;$('who').innerHTML=profile?`Вы вошли: <b>${esc(name(profile.id))}</b> <button id="logout">Выйти</button>`:'';if(profile)$('logout').onclick=()=>act(async()=>{unwrap(await db.auth.signOut());profile=null;draft={};editing=null});$('status').innerHTML=`<h2>${({preparation:'Подготовка',voting:'Голосование',reveal:'Раскрытие баллов',finished:'Финал'})[contest.phase]}</h2>${people.map(p=>`<p>${esc(p.name)} · ${songs.filter(s=>s.participant_id===p.id).length}/5 песен · ${statuses.find(v=>v.participant_id===p.id)?.confirmed?'✅ Подтвердил':'⏳ Ожидаем'}</p>`).join('')}`; $('songs').innerHTML=songs.map((s,i)=>`<article>${safe(s.preview_url)?`<img class="preview" src="${safe(s.preview_url)}">`:'<div class="preview">🎤</div>'}<small>НОМЕР ${i+1} · ${esc(name(s.participant_id))}</small><h2 class="gold">${esc(s.country)}</h2><h3>${esc(s.title)}</h3><p>${esc(s.nomination)}</p>${safe(s.video_url)?`<a target="_blank" rel="noopener noreferrer" href="${safe(s.video_url)}">▶ Смотреть</a>`:''}${profile?.is_admin&&contest.phase==='preparation'?` <button data-edit="${s.id}">✎</button> <button data-del="${s.id}">Удалить</button>`:''}</article>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=songs.find(s=>s.id===b.dataset.edit);admin(true);tab='admin';tabs()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить песню?'))act(async()=>{unwrap(await db.from('songs').delete().eq('id',b.dataset.del))})});admin();vote();stage()}
function admin(force=false){let el=$('admin');el.hidden=!profile?.is_admin;if(!profile?.is_admin)return;let phase=contest.phase;if(!force&&el.dataset.phase===phase&&phase==='preparation'&&el.querySelector('form'))return;el.dataset.phase=phase;el.innerHTML='<h2>👑 Админ-панель</h2>';if(phase==='preparation'){let s=editing||{};el.innerHTML+=`<form id="songform"><select id="owner">${people.map(p=>`<option value="${p.id}" ${s.participant_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="slot">${[1,2,3,4,5].map(n=>`<option ${s.slot===n?'selected':''}>${n}</option>`).join('')}</select><input id="country" placeholder="🇺🇦 Страна" required value="${esc(s.country)}"><input id="title" placeholder="Название песни" required value="${esc(s.title)}"><input id="video" type="url" placeholder="https://..." required value="${esc(s.video_url)}"><input id="nom" placeholder="Номинация" value="${esc(s.nomination)}"><label>Превью <input id="pic" type="file" accept="image/png,image/jpeg,image/webp"></label><button>Сохранить песню</button></form><nav><button id="cancel">Новая песня</button><button id="start">Начать голосование</button></nav><form id="rename"><select id="person">${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input id="newname" required placeholder="Новое имя"><button>Переименовать</button></form>`;$('cancel').onclick=()=>{editing=null;admin(true)};$('start').onclick=()=>{if(confirm('Начать голосование? Песни будут заблокированы.'))act(()=>rpc('start_live_voting'))};$('rename').onsubmit=e=>{e.preventDefault();act(async()=>{unwrap(await db.from('participants').update({name:$('newname').value}).eq('id',$('person').value));el.dataset.phase='';})};$('songform').onsubmit=e=>{e.preventDefault();act(async()=>{let data={participant_id:$('owner').value,slot:+$('slot').value,country:$('country').value,title:$('title').value,video_url:$('video').value,nomination:$('nom').value,preview_url:editing?.preview_url||null};let f=$('pic').files[0];if(f){if(f.size>5242880)throw Error('Картинка больше 5 МБ');let path=crypto.randomUUID();unwrap(await db.storage.from('previews').upload(path,f,{contentType:f.type}));data.preview_url=db.storage.from('previews').getPublicUrl(path).data.publicUrl}unwrap(await (editing?db.from('songs').update(data).eq('id',editing.id):db.from('songs').insert(data)));editing=null;el.dataset.phase='';$('msg').textContent='Песня сохранена'})};}else if(phase==='voting'){let cur=songs.find(s=>s.id===contest.current_song_id);let ready=cur&&people.filter(p=>p.id!==cur.participant_id).every(p=>statuses.find(v=>v.participant_id===p.id)?.current_voted);el.innerHTML+=`<h3>Выступление ${cur?.performance_order??0}/15</h3><p>${esc(cur?.country)} — ${esc(cur?.title)}</p>${people.map(p=>`<p>${esc(p.name)} · ${p.id===cur?.participant_id?'Своя песня':statuses.find(v=>v.participant_id===p.id)?.current_voted?'✅ Оценил':'⏳ Ожидаем'} · ${statuses.find(v=>v.participant_id===p.id)?.confirmed?'Бюллетень подтверждён':''}</p>`).join('')}<button id="advance">Следующая песня</button> <button id="reveal">Начать раскрытие</button>`;$('advance').disabled=!ready||cur?.performance_order>=15;$('advance').onclick=()=>act(()=>rpc('next_performance'));$('reveal').disabled=statuses.filter(v=>v.confirmed).length!==3;$('reveal').onclick=()=>act(()=>rpc('set_contest_phase',{new_phase:'reveal'}))}else if(phase==='reveal'){el.innerHTML+=`<button id="next">Следующая оценка (${contest.revealed_count}/30)</button> <button id="finish">Объявить победителя</button>`;$('next').disabled=contest.revealed_count>=30;$('finish').disabled=contest.revealed_count!==30;$('next').onclick=()=>act(()=>rpc('reveal_next'));$('finish').onclick=()=>act(()=>rpc('set_contest_phase',{new_phase:'finished'}))}}
function vote(){let el=$('ballot');if(!profile||contest.phase!=='voting'){el.innerHTML='<h2>Голосование пока недоступно</h2>';return}if(statuses.find(v=>v.participant_id===profile.id)?.confirmed){el.innerHTML='<h2>✅ Оценки подтверждены</h2>';return}let cur=songs.find(s=>s.id===contest.current_song_id);let foreign=songs.filter(s=>s.participant_id!==profile.id&&s.performance_order&&s.performance_order<=cur?.performance_order);el.innerHTML=`<h2>Мои оценки</h2><p>Золотые баллы уже заняты. Их можно перенести: оценки поменяются местами, а если новой песни ещё не оценивали — прежняя останется без балла.</p><div class="points">${Array.from({length:10},(_,i)=>10-i).map(n=>{let id=Object.keys(draft).find(k=>draft[k]===n);return `<div class="point ${id?'used':''}"><b>${n}</b><small>${id?esc(songs.find(s=>s.id===id)?.country):'Свободен'}</small></div>`}).join('')}</div><p>Оценено ${Object.keys(draft).length}/10 · Сумма ${Object.values(draft).reduce((a,b)=>a+b,0)}/55</p>${cur?.participant_id===profile.id?'<p>Сейчас твоя песня — за неё голосовать нельзя.</p>':''}${foreign.map(s=>`<div class="rank">${s.id===cur?.id?'🔴 ':''}${esc(s.country)} — ${esc(s.title)}<strong><select data-vote="${s.id}"><option value="0" disabled ${!draft[s.id]?'selected':''}>Без оценки</option>${Array.from({length:10},(_,i)=>10-i).map(n=>`<option value="${n}" ${draft[s.id]===n?'selected':''}>${n}${Object.values(draft).includes(n)&&draft[s.id]!==n?' · занят':''}</option>`).join('')}</select></strong></div>`).join('')}<button id="send">Подтвердить окончательно</button><p><small>Подтверждение доступно на последнем выступлении, когда распределены все 10 баллов.</small></p>`;el.querySelectorAll('[data-vote]').forEach(s=>s.onchange=()=>act(()=>rpc('save_draft_vote',{p_song_id:s.dataset.vote,p_points:+s.value})));$('send').disabled=cur?.performance_order!==15||Object.keys(draft).length!==10;$('send').onclick=()=>{if(confirm('Подтвердить оценки? Изменить их больше нельзя.'))act(()=>rpc('confirm_live_ballot'))}}
async function results(){let el=$('results');let rows=await rpc('revealed_votes');if(lastReveal===rows.length&&el.dataset.phase===contest.phase)return;lastReveal=rows.length;el.dataset.phase=contest.phase;let totals=songs.map(s=>({...s,total:rows.filter(v=>v.song_id===s.id).reduce((a,v)=>a+v.points,0)})).sort((a,b)=>b.total-a.total);let last=rows.at(-1);el.innerHTML=`<h2>🏆 ${contest.phase==='finished'?'Финальные результаты':'Таблица лидеров'}</h2>${last?`<h3 class="gold">${esc(name(last.voter_id))} → ${esc(songs.find(s=>s.id===last.song_id)?.country)}: +${last.points}</h3>`:''}${contest.phase==='finished'?'<h2 class="gold">'+totals.filter(s=>s.total===totals[0]?.total).map(s=>esc(s.country)+' — '+esc(s.title)).join(' / ')+'</h2>':''}${totals.map((s,i)=>`<div class="rank">${i===0||s.total!==totals[i-1].total?i+1:totals.findIndex(t=>t.total===s.total)+1}. ${esc(s.country)} — ${esc(s.title)} <strong class="gold">${s.total}</strong></div>`).join('')}`;if(contest.phase==='finished'&&!celebrated){celebrated=true;for(let i=0;i<100;i++){let c=document.createElement('span');c.className='confetti';c.textContent='✦';c.style.left=Math.random()*100+'vw';c.style.color=['#ffe06b','#ef60dd','#66aaff'][i%3];c.style.animationDelay=Math.random()*2+'s';document.body.append(c);setTimeout(()=>c.remove(),6500)}}}
try{let session=unwrap(await db.auth.getSession()).session;if(session){profile=await rpc('my_profile');if(Array.isArray(profile))profile=profile[0];}await refresh()}catch(e){error(e)}setInterval(()=>{if(!busy&&!document.activeElement?.matches('input,select')){busy=true;refresh().catch(error).finally(()=>busy=false)}},4000);
</script></html>
