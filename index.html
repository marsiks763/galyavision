<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Галявидение</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(at top left,#43258a,transparent 55%),#100b20;color:white;font:16px system-ui;min-height:100vh}main{max-width:1150px;margin:auto;padding:24px}header{padding:45px 15px;text-align:center;background:linear-gradient(120deg,#34208b,#a22280);border-radius:24px}h1{font-size:clamp(32px,7vw,80px);margin:10px;color:#ffe06b}button,input,select{font:inherit;border-radius:10px;padding:11px;border:1px solid #64517e}button{background:#ffe06b;color:#20132e;font-weight:bold;cursor:pointer}button:disabled{opacity:.4}input,select{background:#241a39;color:white;max-width:100%}section,article{background:#20172f;border:1px solid #514065;border-radius:18px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.grid article{margin:0;overflow:hidden}.preview{width:100%;aspect-ratio:16/9;object-fit:cover;background:linear-gradient(120deg,#4731a1,#922879);display:grid;place-items:center;font-size:44px}.gold{color:#ffe06b}a{color:#ffe06b}form{display:flex;flex-wrap:wrap;gap:10px}small{color:#d4bce8}.rank{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #514065;animation:appear .4s}.rank strong{margin-left:auto}@keyframes appear{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}.confetti{position:fixed;top:-20px;pointer-events:none;animation:fall 4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}#msg{white-space:pre-wrap;color:#ffe06b}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}</style><main><header><small>★ GRAND FINAL • UNITED BY КРИНЖ ★</small><h1>ГАЛЯВИДЕНИЕ</h1>Здесь рождаются легенды. И коллективный стыд.</header><section id="auth"><form id="login"><select id="email"><option>admin@galyavision.example</option><option>player1@galyavision.example</option><option>player2@galyavision.example</option></select><input id="pw" type="password" placeholder="Пароль" required><button>Войти</button></form><div id="who"></div></section><p id="msg" role="status"></p><section id="status"></section><section id="admin" hidden></section><h2>🎤 Конкурсные выступления</h2><div id="songs" class="grid"></div><section id="ballot" hidden></section><section id="results" hidden></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://fzwhijhauccjymwfpwkp.supabase.co','sb_publishable_ol4aEpw8knUOt8AAc0n36A_FqmdCRI_');
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), safe=x=>{try{let u=new URL(x);return ['https:','http:'].includes(u.protocol)?esc(u.href):''}catch{return ''}};let profile=null,people=[],songs=[],contest={},statuses=[],draft={},editing=null,lastReveal=-1,celebrated=false,busy=false;const unwrap=r=>{if(r.error)throw Error(r.error.message);return r.data};const rpc=async(n,p)=>unwrap(await db.rpc(n,p));function error(e){$('msg').textContent=e.message||String(e)}async function act(fn){if(busy)return;busy=true;try{$('msg').textContent='';await fn();await refresh()}catch(e){error(e)}finally{busy=false}}$('login').onsubmit=e=>{e.preventDefault();act(async()=>{unwrap(await db.auth.signInWithPassword({email:$('email').value,password:$('pw').value}));$('pw').value='';profile=await rpc('my_profile');draft={}})};
async function refresh(){let [p,s,c,v]=await Promise.all([db.from('participants').select('id,name'),db.from('songs').select('*'),db.from('contest').select('*').eq('id',1).single(),db.rpc('voting_status')]);people=unwrap(p);songs=unwrap(s).sort((a,b)=>a.participant_id.localeCompare(b.participant_id)||a.slot-b.slot);contest=unwrap(c);statuses=unwrap(v);render();if(['reveal','finished'].includes(contest.phase))await results()}
const name=id=>people.find(p=>p.id===id)?.name||'Участник';function render(){ $('login').hidden=!!profile;$('who').innerHTML=profile?`Вы вошли: <b>${esc(name(profile.id))}</b> <button id="logout">Выйти</button>`:'';if(profile)$('logout').onclick=()=>act(async()=>{unwrap(await db.auth.signOut());profile=null;draft={};editing=null});$('status').innerHTML=`<h2>${({preparation:'Подготовка',voting:'Голосование',reveal:'Раскрытие баллов',finished:'Финал'})[contest.phase]}</h2>${people.map(p=>`<p>${esc(p.name)} · ${songs.filter(s=>s.participant_id===p.id).length}/5 песен · ${statuses.find(v=>v.participant_id===p.id)?.voted?'✅ Проголосовал':'⏳ Ожидаем'}</p>`).join('')}`; $('songs').innerHTML=songs.map((s,i)=>`<article>${safe(s.preview_url)?`<img class="preview" src="${safe(s.preview_url)}">`:'<div class="preview">🎤</div>'}<small>НОМЕР ${i+1} · ${esc(name(s.participant_id))}</small><h2 class="gold">${esc(s.country)}</h2><h3>${esc(s.title)}</h3><p>${esc(s.nomination)}</p>${safe(s.video_url)?`<a target="_blank" rel="noopener noreferrer" href="${safe(s.video_url)}">▶ Смотреть</a>`:''}${profile?.is_admin&&contest.phase==='preparation'?` <button data-edit="${s.id}">✎</button> <button data-del="${s.id}">Удалить</button>`:''}</article>`).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=songs.find(s=>s.id===b.dataset.edit);admin(true)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Удалить песню?'))act(async()=>{unwrap(await db.from('songs').delete().eq('id',b.dataset.del))})});admin();vote()}
function admin(force=false){let el=$('admin');el.hidden=!profile?.is_admin;if(el.hidden)return;let phase=contest.phase;if(!force&&el.dataset.phase===phase&&phase==='preparation'&&el.querySelector('form'))return;el.dataset.phase=phase;el.innerHTML='<h2>👑 Админ-панель</h2>';if(phase==='preparation'){let s=editing||{};el.innerHTML+=`<form id="songform"><select id="owner">${people.map(p=>`<option value="${p.id}" ${s.participant_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="slot">${[1,2,3,4,5].map(n=>`<option ${s.slot===n?'selected':''}>${n}</option>`).join('')}</select><input id="country" placeholder="🇺🇦 Страна" required value="${esc(s.country)}"><input id="title" placeholder="Название песни" required value="${esc(s.title)}"><input id="video" type="url" placeholder="https://..." required value="${esc(s.video_url)}"><input id="nom" placeholder="Номинация" value="${esc(s.nomination)}"><label>Превью <input id="pic" type="file" accept="image/png,image/jpeg,image/webp"></label><button>Сохранить песню</button></form><nav><button id="cancel">Новая песня</button><button id="start">Начать голосование</button></nav><form id="rename"><select id="person">${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><input id="newname" required placeholder="Новое имя"><button>Переименовать</button></form>`;$('cancel').onclick=()=>{editing=null;admin(true)};$('start').onclick=()=>{if(confirm('Начать голосование? Песни будут заблокированы.'))act(()=>rpc('set_contest_phase',{new_phase:'voting'}))};$('rename').onsubmit=e=>{e.preventDefault();act(async()=>{unwrap(await db.from('participants').update({name:$('newname').value}).eq('id',$('person').value));el.dataset.phase='';})};$('songform').onsubmit=e=>{e.preventDefault();act(async()=>{let data={participant_id:$('owner').value,slot:+$('slot').value,country:$('country').value,title:$('title').value,video_url:$('video').value,nomination:$('nom').value,preview_url:editing?.preview_url||null};let f=$('pic').files[0];if(f){if(f.size>5242880)throw Error('Картинка больше 5 МБ');let path=crypto.randomUUID();unwrap(await db.storage.from('previews').upload(path,f,{contentType:f.type}));data.preview_url=db.storage.from('previews').getPublicUrl(path).data.publicUrl}unwrap(await (editing?db.from('songs').update(data).eq('id',editing.id):db.from('songs').insert(data)));editing=null;el.dataset.phase='';$('msg').textContent='Песня сохранена'})};}else if(phase==='voting'){el.innerHTML+='<button id="reveal">Начать раскрытие</button>';$('reveal').disabled=statuses.filter(v=>v.voted).length!==3;$('reveal').onclick=()=>act(()=>rpc('set_contest_phase',{new_phase:'reveal'}))}else if(phase==='reveal'){el.innerHTML+=`<button id="next">Следующая оценка (${contest.revealed_count}/30)</button> <button id="finish">Объявить победителя</button>`;$('next').disabled=contest.revealed_count>=30;$('finish').disabled=contest.revealed_count!==30;$('next').onclick=()=>act(()=>rpc('reveal_next'));$('finish').onclick=()=>act(()=>rpc('set_contest_phase',{new_phase:'finished'}))}}
function vote(){let el=$('ballot');el.hidden=!profile||contest.phase!=='voting';if(el.hidden)return;if(statuses.find(v=>v.participant_id===profile.id)?.voted){el.innerHTML='<h2>✅ Голос принят. Ждём остальных!</h2>';return}let foreign=songs.filter(s=>s.participant_id!==profile.id);el.innerHTML=`<h2>Ваши оценки</h2><p>Используйте каждый балл от 1 до 10 ровно один раз.</p>${foreign.map(s=>`<div class="rank">${esc(s.country)} — ${esc(s.title)}<strong><select data-vote="${s.id}"><option value="0">—</option>${Array.from({length:10},(_,i)=>10-i).filter(n=>!Object.values(draft).includes(n)||draft[s.id]===n).map(n=>`<option ${draft[s.id]===n?'selected':''}>${n}</option>`).join('')}</select></strong></div>`).join('')}<p>Выставлено ${foreign.filter(s=>draft[s.id]).length}/10</p><button id="send">Отправить оценки</button>`;el.querySelectorAll('[data-vote]').forEach(s=>s.onchange=()=>{draft[s.dataset.vote]=+s.value;vote()});$('send').disabled=foreign.length!==10||foreign.some(s=>!draft[s.id]);$('send').onclick=()=>{if(confirm('Отправить оценки окончательно?'))act(()=>rpc('submit_votes',{ballot:foreign.map(s=>({song_id:s.id,points:draft[s.id]}))}))}}
async function results(){let el=$('results');el.hidden=false;let rows=await rpc('revealed_votes');if(lastReveal===rows.length&&el.dataset.phase===contest.phase)return;lastReveal=rows.length;el.dataset.phase=contest.phase;let totals=songs.map(s=>({...s,total:rows.filter(v=>v.song_id===s.id).reduce((a,v)=>a+v.points,0)})).sort((a,b)=>b.total-a.total);let last=rows.at(-1);el.innerHTML=`<h2>🏆 ${contest.phase==='finished'?'Финальные результаты':'Таблица лидеров'}</h2>${last?`<h3 class="gold">${esc(name(last.voter_id))} → ${esc(songs.find(s=>s.id===last.song_id)?.country)}: +${last.points}</h3>`:''}${contest.phase==='finished'?'<h2 class="gold">'+totals.filter(s=>s.total===totals[0]?.total).map(s=>esc(s.country)+' — '+esc(s.title)).join(' / ')+'</h2>':''}${totals.map((s,i)=>`<div class="rank">${i===0||s.total!==totals[i-1].total?i+1:totals.findIndex(t=>t.total===s.total)+1}. ${esc(s.country)} — ${esc(s.title)} <strong class="gold">${s.total}</strong></div>`).join('')}`;if(contest.phase==='finished'&&!celebrated){celebrated=true;for(let i=0;i<100;i++){let c=document.createElement('span');c.className='confetti';c.textContent='✦';c.style.left=Math.random()*100+'vw';c.style.color=['#ffe06b','#ef60dd','#66aaff'][i%3];c.style.animationDelay=Math.random()*2+'s';document.body.append(c);setTimeout(()=>c.remove(),6500)}}}
try{let session=unwrap(await db.auth.getSession()).session;if(session)profile=await rpc('my_profile');await refresh()}catch(e){error(e)}setInterval(()=>{if(!busy&&!document.activeElement?.matches('input,select'))refresh().catch(error)},4000);
</script></html>
